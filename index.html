<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="theme-color"
      content="#43c893"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="description" content="Developer RYU" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Self-hosted Pretendard subset (single same-origin request).
         @font-face lives in index.css; preload so it downloads in parallel. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/pretendard-subset.woff2"
      crossorigin
    />

    <!-- Only the above-the-fold profile image is preloaded; coffee.webp is
         below the fold and lazy-loaded, so it no longer blocks initial load -->
    <link rel="preload" as="image" href="/self.webp" fetchpriority="high" />
    <title>RYU</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
