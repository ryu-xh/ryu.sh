<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="theme-color"
      content="#43c893"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="description" content="Developer RYU" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts & emoji assets are served from jsDelivr; warm the connection early -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <!-- Default (ko) font loaded directly (no render-blocking @import chain);
     the JP font is injected at runtime only for Japanese visitors -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css"
      crossorigin
    />

    <link rel="preload" as="image" href="/self.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/coffee.webp" fetchpriority="high" />
    <title>RYU</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
